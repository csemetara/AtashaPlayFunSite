<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Luna's Learning Adventure</title>
  <meta name="description" content="A calm, magical play-based learning world for preschoolers." />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app-root" role="main" aria-live="polite"></div>

  <!--
    Loaded as plain scripts (not type="module") so the app can be opened
    directly via file:// without hitting browser CORS restrictions on
    ES module imports. Each file attaches itself to the shared `Luna`
    namespace object — load order matters and mirrors the dependency
    chain: core services first, then registry, then games, then UI/router,
    then app.js boots everything last.
  -->
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/canvasEngine.js"></script>
  <script src="js/floatingObjects.js"></script>
  <script src="js/gameRegistry.js"></script>

  <script src="js/games/color-matching.js"></script>
  <script src="js/games/little-chef.js"></script>
  <script src="js/games/memory-game.js"></script>
  <script src="js/games/shape-matching.js"></script>
  <script src="js/games/abc-adventure.js"></script>
  <script src="js/games/color-world.js"></script>
  <script src="js/games/tracing.js"></script>
  <script src="js/games/animal-sounds.js"></script>
  <script src="js/games/farm-adventure.js"></script>
  <script src="js/games/puzzle-game.js"></script>
  <script src="js/games/bubble-pop.js"></script>
  <script src="js/games/balloon-game.js"></script>
  <script src="js/games/ocean-world.js"></script>
  <script src="js/games/dress-up.js"></script>
  <script src="js/games/music-piano.js"></script>
  <script src="js/games/find-the-object.js"></script>
  <script src="js/games/story-time.js"></script>
  <script src="js/games/sing-along.js"></script>
  <script src="js/games/number-world.js"></script>
  <script src="js/games/space-adventure.js"></script>

  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
